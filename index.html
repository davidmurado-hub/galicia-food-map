<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galicia Food Map | Geospatial Explorer</title>

  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">

  <meta name="description" content="Explore selected fast-food locations in Galicia using open geospatial data.">
  <link rel="stylesheet" href="assets/css/style.css">
</head><body>
<header class="cabecera"><div><h1>Galicia Food Map</h1><p>Exploring the geography of selected fast-food locations</p></div><button class="volver" id="volver-lalin" type="button">Focus on Lalín</button></header>
<section class="metrics" aria-label="Location counts"><div class="metric"><strong id="bk-count">–</strong><span>Burger King</span></div><div class="metric"><strong id="mc-count">–</strong><span>McDonald's</span></div><div class="metric"><strong id="kebab-count">–</strong><span>Kebab shops</span></div></section>
<main class="mapa-container"><div id="map" aria-label="Interactive map of Galicia"></div></main>
<footer class="estado" id="estado" role="status">Loading map…</footer>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="data/puntos_osm.js"></script><script src="assets/js/map.js"></script>
</body></html>
